[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fx-agents"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "langgraph>=0.3",
    "langgraph-checkpoint-postgres>=2.0",
    "psycopg[binary,pool]>=3.1",
    "redis[asyncio]>=5.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    # LLM
    "anthropic>=0.44",
    # Market data
    "yfinance>=0.2",
    "pandas>=2.0",
    # Macro data
    "fredapi>=0.5",
    # News & sentiment
    "finnhub-python>=2.4",
    # Social sentiment
    "praw>=7.7",
    # PDF reports
    "fpdf2>=2.7",
    # REST server
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sse-starlette>=2.1",
    # HTTP client (market feeds)
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "fakeredis>=2.20",
    "ruff>=0.4",
]
market = [
    # Interactive Brokers feed
    "ib_insync>=0.9",
    # FIX protocol feed
    "quickfix>=1.15",
]

[tool.hatch.build.targets.wheel]
packages = ["src/fx_agent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
